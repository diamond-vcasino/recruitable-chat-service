spring:
  application:
    name: recruitable-chat-service-test

  data:
    mongodb:
      uri: mongodb://localhost:27017/recruitable_chat_test
      database: recruitable_chat_test
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    property-naming-strategy: SNAKE_CASE

  rabbitmq:
    host: localhost
    port: 5672

app:
  jwt:
    secret: test-secret-key-must-be-at-least-64-characters-long-for-hmac-sha512!
    issuer: recruitable-api
    audience: recruitable-client

  rabbitmq:
    exchange: chat.exchange
    queue: chat.events
    routing-key: chat.broadcast

  s3:
    endpoint: http://localhost:9000
    bucket-name: test-bucket
    access-key-id: test-key
    secret-access-key: test-secret
    region: us-east-1
