name: Deploy to Server

on:
  # Auto-trigger after build passes on develop or staging only
  workflow_run:
    workflows: ["Build and Test"]
    branches:
      - develop
      - staging
      # - main
    types:
      - completed

  # Manual trigger — develop, staging, and main (prod placeholder)
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - staging
          # - main

jobs:
  deploy:
    name: Deploy to Ubuntu Server
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Resolve branch
        run: |
          BRANCH="${{ github.event.inputs.branch || github.event.workflow_run.head_branch }}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_USERNAME
          server-password: GITHUB_TOKEN

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR
        run: mvn clean package -B -DskipTests
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.AURORA_GITHUB_TOKEN }}

      - name: Set deploy config based on branch
        run: |
          if [ "${{ env.BRANCH }}" = "develop" ]; then
            echo "JAR_NAME=app-develop.jar" >> $GITHUB_ENV
            echo "COMPOSE_FILE=docker-compose-dev.yml" >> $GITHUB_ENV
            echo "SERVICE=recruiter-chat-service" >> $GITHUB_ENV
          elif [ "${{ env.BRANCH }}" = "staging" ]; then
            echo "JAR_NAME=app-staging.jar" >> $GITHUB_ENV
            echo "COMPOSE_FILE=docker-compose-staging.yml" >> $GITHUB_ENV
            echo "SERVICE=recruiter-chat-service-staging" >> $GITHUB_ENV
          elif [ "${{ env.BRANCH }}" = "main" ]; then
            echo "JAR_NAME=app-prod.jar" >> $GITHUB_ENV
            echo "COMPOSE_FILE=docker-compose-prod.yml" >> $GITHUB_ENV
            echo "SERVICE=recruiter-chat-service-prod" >> $GITHUB_ENV
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Resolve JWT secret
        run: |
          JWT_SECRET_VALUE="${{ secrets.JWT_SECRET }}"
          if [ -z "$JWT_SECRET_VALUE" ]; then
            JWT_SECRET_VALUE="${{ vars.JWT_SECRET }}"
          fi
          if [ -z "$JWT_SECRET_VALUE" ]; then
            echo "JWT_SECRET is not configured in GitHub secrets or vars" >&2
            exit 1
          fi
          JWT_LEN=$(printf %s "$JWT_SECRET_VALUE" | wc -c | tr -d ' ')
          if [ "$JWT_LEN" -lt 64 ]; then
            echo "JWT_SECRET must be at least 64 characters for HS512 (got $JWT_LEN)" >&2
            exit 1
          fi
          echo "::add-mask::$JWT_SECRET_VALUE"
          echo "JWT_SECRET_VALUE=$JWT_SECRET_VALUE" >> $GITHUB_ENV
          echo "SHARED_ENV_PATH=/home/ubuntu/recruitable-api-backend/.env" >> $GITHUB_ENV

      - name: Copy JAR to server
        run: |
          scp -i ~/.ssh/deploy_key target/*.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/ubuntu/recruiter-chat-service/${{ env.JAR_NAME }}

      - name: Write .env file on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            printf 'JWT_SECRET=%s\n' '${{ env.JWT_SECRET_VALUE }}' > '${{ env.SHARED_ENV_PATH }}'
            chmod 600 '${{ env.SHARED_ENV_PATH }}'
          EOF

      - name: Restart service on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            docker compose --env-file '${{ env.SHARED_ENV_PATH }}' -f /home/ubuntu/recruiter-services/${{ env.COMPOSE_FILE }} up -d --force-recreate ${{ env.SERVICE }}
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key