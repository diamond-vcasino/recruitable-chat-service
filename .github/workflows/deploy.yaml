name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build and Test"]
    branches:
      - develop
    types:
      - completed

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "develop"
        type: choice
        options:
          - develop

jobs:
  deploy:
    name: Deploy to Ubuntu Server
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.event.workflow_run.head_branch || 'develop' }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
          server-id: github
          server-username: GITHUB_USERNAME
          server-password: GITHUB_TOKEN

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR
        run: mvn clean package -B -DskipTests
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.AURORA_GITHUB_TOKEN }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Copy JAR to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        run: |
          TARGET_DIR="${SERVER_APP_DIR:-/home/ubuntu/recruitable-chat-service}"
          ssh -i ~/.ssh/deploy_key ${SERVER_USER}@${SERVER_HOST} "mkdir -p ${TARGET_DIR}"
          scp -i ~/.ssh/deploy_key target/*.jar ${SERVER_USER}@${SERVER_HOST}:${TARGET_DIR}/app.jar

      - name: Restart service on server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_COMPOSE_DIR: ${{ secrets.SERVER_COMPOSE_DIR }}
          DEPLOY_SERVICE_NAME: ${{ secrets.DEPLOY_SERVICE_NAME }}
        run: |
          COMPOSE_DIR="${SERVER_COMPOSE_DIR:-/home/ubuntu/recruitable-services}"
          SERVICE_NAME="${DEPLOY_SERVICE_NAME:-recruitable-chat-service}"
          ssh -i ~/.ssh/deploy_key ${SERVER_USER}@${SERVER_HOST} << EOF
            set -e
            cd ${COMPOSE_DIR}
            docker compose up -d --force-recreate ${SERVICE_NAME}
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
